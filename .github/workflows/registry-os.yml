name: registry-os

# Hologram Registry (cargo feature `oci`) on the three systems v1 commits to.
# Runs on every pull request and in the merge queue, skipping when no registry
# path changed (apps/registry/gates/release/registry-changed.sh), and in full on main.
on:
  push:
    branches: [main, "registry/**"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Registry touched?
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) run=$(apps/registry/gates/release/registry-changed.sh "$PR_BASE" HEAD) ;;
            merge_group) run=$(apps/registry/gates/release/registry-changed.sh "$MQ_BASE" HEAD) ;;
            *) run=true ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Registry touched: $run ($EVENT)" >> "$GITHUB_STEP_SUMMARY"

  oci-store:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: registry-os-${{ matrix.os }}
      - name: The pin is the documented one; aws-lc is not in the graph
        if: runner.os == 'Linux'
        run: ./scripts/check-kappa-pin.sh
      - name: Unit tests
        run: cargo test --locked --features oci --lib oci_store -- --test-threads=1 --nocapture
      - name: Integration tests
        run: cargo test --locked --features oci --test oci_store -- --test-threads=1
      - name: Registry module, unit tests (parser, errors, ranges)
        run: cargo test --locked --features oci --lib -- modules::oci module::tests registry_compat config::tests::registry_mode
      - name: The reference's command line (registry serve, garbage-collect, entrypoint.sh)
        run: cargo test --locked --features oci --bin hologram -- registry_argv
      - name: Registry over HTTP, through the handler and through the binary
        run: cargo test --locked --features oci --test oci_http
      - name: Login from a password file (auth.htpasswd)
        run: cargo test --locked --features oci --test oci_login
      - name: TLS on the listener (http.tls)
        run: cargo test --locked --features oci --test oci_tls
      - name: hologram oci verify (P8 T3)
        run: cargo test --locked --features oci --test oci_verify
      - name: The debug listener (health, metrics)
        run: cargo test --locked --features oci --test oci_debug
      - name: Memory while pushing 2 GiB stays under 200 MB (SC-007 in small)
        if: runner.os == 'Linux'
        run: cargo test --release --locked --features oci --test oci_store -- --ignored --nocapture two_gib
      - name: No layer in memory, no Kappa type outside the adapter
        if: runner.os == 'Linux'
        run: ./scripts/check-oci-streaming.sh
      - name: Clippy, registry build
        if: runner.os == 'Linux'
        run: cargo clippy --locked --features oci --all-targets -- -D warnings

  verdict:
    # The one check branch protection requires. Green when no registry path
    # changed; otherwise green only when every job above passed.
    name: registry-os · verdict
    if: always()
    needs: [changes, oci-store]
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes=$CHANGES run=$RUN results: $RESULTS"
          [ "$CHANGES" = success ] || exit 1
          if [ "$RUN" = true ]; then
            for r in $RESULTS; do [ "$r" = success ] || exit 1; done
          fi
