name: gates

# Hologram Registry's equivalence gates. Each job judges the real binary from
# outside, with a tool we did not write. Path-filtered like registry-os.
on:
  push:
    branches: ["registry/**"]
  pull_request:
    paths:
      - "src/oci_store/**"
      - "src/modules/oci/**"
      - "src/registry_compat/**"
      - "apps/registry/**"
      - "third_party/kappa/**"
      - "tests/oci_*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gates.yml"

permissions:
  contents: read

jobs:
  gate-a:
    name: Gate A · OCI conformance (pull, push)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Reported, not blocking, until both categories have been green once in
    # CI. Then this line goes and they block (plan, P3 task 6 and P4 exit).
    # While it is here a red suite still shows a green run: read the summary.
    continue-on-error: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # opencontainers/distribution-spec v1.1.1, by digest.
      CONFORMANCE_IMAGE: ghcr.io/opencontainers/distribution-spec/conformance@sha256:609201aab0905b1e90ded490e5f0dbaadc9a4bef98aca4cd38ff308f588ed27a
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: gates
      - name: Build the server
        run: cargo build --locked --features oci --bin hologram
      - name: Write the configuration
        run: |
          mkdir -p "$RUNNER_TEMP/reg/config" "$RUNNER_TEMP/report"
          chmod 0777 "$RUNNER_TEMP/report"
          cat > "$RUNNER_TEMP/reg/config/live.toml" <<EOF
          schema_version = 2

          [paths]
          config_dir = "$RUNNER_TEMP/reg/config"
          data_dir = "$RUNNER_TEMP/reg/data"
          state_dir = "$RUNNER_TEMP/reg/state"
          cache_dir = "$RUNNER_TEMP/reg/cache"

          [server]
          listen = "127.0.0.1:5000"

          [modules]
          enabled = ["dev.hologram.live.system", "dev.hologram.live.oci"]
          EOF
      - name: Start the server
        run: |
          ./target/debug/hologram --config "$RUNNER_TEMP/reg/config/live.toml" serve > "$RUNNER_TEMP/report/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/v2/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/report/server.log"
          exit 1
      - name: OCI conformance, pull and push categories
        # The suite pushes what it then pulls, so nothing is seeded.
        run: |
          set -o pipefail
          docker run --rm --network host \
            -v "$RUNNER_TEMP/report:/report" \
            -e OCI_ROOT_URL=http://127.0.0.1:5000 \
            -e OCI_NAMESPACE=myorg/myrepo \
            -e OCI_CROSSMOUNT_NAMESPACE=myorg/other \
            -e OCI_TEST_PULL=1 \
            -e OCI_TEST_PUSH=1 \
            -e OCI_TEST_CONTENT_DISCOVERY=0 \
            -e OCI_TEST_CONTENT_MANAGEMENT=0 \
            -e OCI_HIDE_SKIPPED_WORKFLOWS=1 \
            -e OCI_REPORT_DIR=/report \
            "$CONFORMANCE_IMAGE" | tee "$RUNNER_TEMP/report/conformance.log"
      - name: Verdict
        if: always()
        run: |
          {
            echo '### Gate A · OCI conformance (pull, push)'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/report/conformance.log" | grep -E 'Ran [0-9]+ of|Passed|\[FAIL\]' || echo 'no verdict: the suite did not run'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-a-report
          path: ${{ runner.temp }}/report
          if-no-files-found: warn
